# Guárdalo en el repositorio como: .github/workflows/build-apk.yml
# El repositorio debe contener también card-jitsu.zip en la raíz.
name: Build Card-Jitsu APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Descomprimir el proyecto (card-jitsu.zip)
        run: |
          set -euo pipefail
          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          if [ -z "$ZIP" ]; then
            echo "::error::No se encontró ningún .zip en la raíz del repositorio. Sube card-jitsu.zip."
            exit 1
          fi
          echo "Usando $ZIP"
          rm -rf project
          mkdir project
          unzip -q "$ZIP" -d project
          PUBSPEC="$(find project -maxdepth 3 -type f -name pubspec.yaml | head -n 1)"
          if [ -z "$PUBSPEC" ]; then
            echo "::error::El zip no contiene pubspec.yaml."
            exit 1
          fi
          APP_DIR="$(cd "$(dirname "$PUBSPEC")" && pwd)"
          echo "APP_DIR=$APP_DIR" >> "$GITHUB_ENV"
          echo "Proyecto en: $APP_DIR"
          ls "$APP_DIR"

      - name: Generar carpeta android
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          flutter create --platforms=android --project-name card_jitsu --org com.minos .
          # flutter create añade un test de ejemplo que no corresponde a este juego
          rm -f test/widget_test.dart

      - name: Nombre "Card-Jitsu" e icono
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          MANIFEST=android/app/src/main/AndroidManifest.xml
          sed -i 's/android:label="[^"]*"/android:label="Card-Jitsu"/' "$MANIFEST"
          grep -q 'android:label="Card-Jitsu"' "$MANIFEST" || { echo "::error::No se pudo poner el nombre en el AndroidManifest"; exit 1; }
          cp -r android_overrides/res/. android/app/src/main/res/
          ls android/app/src/main/res/mipmap-anydpi-v26

      - name: Dependencias
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          flutter --version
          flutter pub get

      - name: Tests de reglas (no bloquea el APK)
        continue-on-error: true
        run: |
          cd "$APP_DIR"
          flutter test

      - name: Compilar APK
        run: |
          set -euo pipefail
          cd "$APP_DIR"
          flutter build apk --release
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp build/app/outputs/flutter-apk/app-release.apk "$GITHUB_WORKSPACE/out/Card-Jitsu.apk"
          ls -la "$GITHUB_WORKSPACE/out"

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Card-Jitsu-APK
          path: out/Card-Jitsu.apk
          if-no-files-found: error
